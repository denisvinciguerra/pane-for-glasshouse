name: Pane
options:
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
packages:
  PaneKit:
    path: PaneKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
schemes:
  Pane:
    build:
      targets:
        Pane: all
    run:
      config: Debug
  Pane iOS:
    build:
      targets:
        Pane iOS: all
    run:
      config: Debug
targets:
  Pane:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
      - path: Shared
        excludes:
          - "Resources/Fonts"
          - "Resources/Fonts/**"
      # A folder reference: copied whole to Contents/Resources/Fonts, where ATSApplicationFontsPath looks.
      - path: Shared/Resources/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: PaneKit
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.synlink.pane
        PRODUCT_NAME: "Pane for Glasshouse"
        CODE_SIGN_IDENTITY: "-"
        INFOPLIST_FILE: App/Info.plist
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        MARKETING_VERSION: 1.1.0
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  Pane iOS:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      # The fonts are plain resources here, at the bundle's root, where UIAppFonts looks.
      - path: Shared
      - path: iOSApp
    dependencies:
      - package: PaneKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.synlink.pane
        PRODUCT_NAME: "Pane for Glasshouse"
        INFOPLIST_FILE: iOSApp/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: 1.2.0
        CURRENT_PROJECT_VERSION: 2
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        SWIFT_EMIT_LOC_STRINGS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
